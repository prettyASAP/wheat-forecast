<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adatfolyam</title>
<style>
  :root { --bg:#ffffff; --panel:#f6f8fa; --line:#d0d7de; --fg:#1f2328; --dim:#656d76; --ok:#1a7f37; --warn:#9a6700; --err:#cf222e; --run:#0969da; --wait:#8c959f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --fg:#e6edf3; --dim:#8b949e; --ok:#3fb950; --warn:#d29922; --err:#f85149; --run:#58a6ff; --wait:#6e7681; }
  }
  body { margin:0; padding:28px 32px; background:var(--bg); color:var(--fg); font:14px/1.5 -apple-system, "Segoe UI", sans-serif; }
  header h1 { font-size:20px; margin:0; }
  header .meta { color:var(--dim); margin-top:2px; }
  header .olvasat { margin-top:10px; font-size:15px; }
  h2 { font-size:15px; margin:30px 0 8px; }
  .box { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; overflow-x:auto; }
  .ketto { display:flex; gap:14px; align-items:flex-start; }
  .ketto > .box { flex:1; min-width:0; }
  .kartya { width:320px; flex:none; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; position:sticky; top:16px; }
  .kartya h3 { margin:0; font-size:14px; }
  .kartya .tipus { color:var(--dim); font-size:12px; margin-bottom:8px; }
  .kartya dl { margin:0; }
  .kartya dt { color:var(--dim); font-size:12px; margin-top:8px; }
  .kartya dd { margin:0; overflow-wrap:anywhere; }
  .kartya dd.kis { font-size:12px; }
  .ures { color:var(--dim); }
  table { border-collapse:collapse; width:100%; }
  th, td { padding:7px 12px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  th { color:var(--dim); font-weight:500; font-size:12px; }
  tbody tr { cursor:pointer; }
  tbody tr:hover, tbody tr.on { background:color-mix(in srgb, var(--run) 10%, transparent); }
  td.nev { white-space:nowrap; font-weight:600; }
  td.tip { color:var(--dim); white-space:nowrap; }
  .all { white-space:nowrap; }
  .erintett { color:var(--dim); font-size:12px; }
  .pont { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; box-sizing:border-box; }
  svg text { fill:var(--fg); font:12px -apple-system, "Segoe UI", sans-serif; }
  svg .sub { fill:var(--dim); font-size:11px; }
  svg .doboz { fill:var(--bg); stroke:var(--line); }
  svg g.cs { cursor:pointer; }
  svg g.cs.on .doboz { stroke:var(--run); stroke-width:2; }
  svg .el { fill:none; stroke:var(--line); stroke-width:1.5; }
  svg .el.warn { stroke:var(--warn); }
  svg .el.err { stroke:var(--err); }
  svg .el.on { stroke:var(--run); stroke-width:2; }
  svg .cimke { fill:var(--dim); font-size:11px; }
  .jel { display:flex; gap:16px; flex-wrap:wrap; margin-top:10px; color:var(--dim); font-size:12px; }
  ul.lista { margin:0; padding-left:18px; }
  ul.lista li { margin:3px 0; }
  ul.lista span { color:var(--dim); }
</style>
</head>

    // a több oszlopot átugró vonal a közbeeső dobozok fölött vagy alatt fut
    if (koz.length) { const g = gx / 2, fent = y2 < y1, L = fent ? Math.min(...koz.map(e => e.y)) - 12 : Math.max(...koz.map(e => e.y + H)) + 12;
      d = `M${x1},${y1} C${x1 + g},${y1} ${x1 + g},${L} ${x1 + gx},${L} L${x2 - gx},${L} C${x2 - g},${L} ${x2 - g},${y2} ${x2},${y2}`; cx = k; cy = fent ? L - 5 : L + 14; }
    else { d = `M${x1},${y1} C${k},${y1} ${k},${y2} ${x2},${y2}`; cx = k; cy = (y1 + y2) / 2 - 5; } }
  const ut = s(svg, 'path', { class: 'el' + (osztaly ? ' ' + osztaly : ''), d });
  const felirat = cimke ? s(svg, 'text', { class: 'cimke', x: cx, y: cy, 'text-anchor': a.oszlop === b.oszlop ? 'start' : 'middle' }, cimke) : null;
  return [ut, felirat];
}

// folyam
(() => {
  const svg = $('folyam'), W = 150, H = 50;
  const [sz, mag] = elrendez(D.csomopontok, be, W, H, 30, 16, true);
  svg.setAttribute('width', sz); svg.setAttribute('height', mag);
  D.csomopontok.forEach(c => c.bemenet && c.bemenet.forEach(b => gorbe(svg, cs[b], c, W, H, ['', 'warn', 'err'][szint(b)], null, 30, D.csomopontok)));
  D.csomopontok.forEach(c => {
    const g = s(svg, 'g', { class: 'cs', 'data-cs': c.id });
    s(g, 'title', {}, 'Megmutatja a lépés részleteit, bizonyítékát és előzményét');
    s(g, 'rect', { class: 'doboz', x: c.x, y: c.y, width: W, height: H, rx: 7 });
    s(g, 'circle', { cx: c.x + 13, cy: c.y + 17, r: ures(c) ? 3.5 : 4, fill: ures(c) ? 'none' : szin(c), stroke: szin(c), 'stroke-width': ures(c) ? 2 : 0 });
    s(g, 'text', { x: c.x + 24, y: c.y + 21, 'font-weight': 600 }, rov(c.nev, 19));
    s(g, 'text', { class: 'sub', x: c.x + 12, y: c.y + 38 }, rov(c.uzenet || nev(c), 25));
    g.onclick = () => mutat(c.id);
  });
  const jel = $('jel');
  ['kesz', 'nyom', 'hiany', 'hiba', 'fut', 'var', 'nincs'].filter(k => D.csomopontok.some(c => c.allapot === k && !jelentett(c))).forEach(k => { const e = h('span'); e.append(pont({ allapot: k }), ST[k][0]); jel.append(e); });
  if (D.csomopontok.some(jelentett)) { const e = h('span'); e.append(pont({ allapot: 'kesz', mod: 'jelentett' }), 'a lépés jelentette, nem mérés'); jel.append(e); }
  if (D.csomopontok.some(c => szint(c.id) && !['hiba', 'hiany'].includes(c.allapot))) jel.append(h('span', {}, 'színes vonal: hibás vagy hiányos lépésre épül'));
})();

// védelem
(() => {
  const v = $('vedelem');
  const resz = (cim, elemek, f) => { if (!elemek.length) return; v.append(h('h2', {}, cim));
    const ul = h('ul', { class: 'lista' }); elemek.forEach(m => { const li = h('li', {}, m.nev + ' '); li.append(h('span', {}, f(m))); ul.append(li); });
    const b = h('div', { class: 'box' }); b.append(ul); v.append(b); };
  resz('Hiányzó védelem', D.hianyzo_mintak, m => m.miert);
  resz('Van, de nem mért védelem', D.nem_mert_mintak, m => `a „${m.lepes}” lépés végzi, de az eredménye nincs megmérve, ezért nem számít védelemnek`);
  resz('Tudatosan kihagyva', D.kihagyott_mintak, m => m.ok);
})();

// objektumok
(() => {
  const svg = $('onto'), W = 160, H = 50;
  const obe = {}; D.objektumok.forEach(o => obe[o.id] = []);
  D.kapcsolatok.forEach(k => { if (k.honnan !== k.hova) obe[k.hova].push(k.honnan); });
  const [sz, mag] = elrendez(D.objektumok, obe, W, H, 70, 26);
  svg.setAttribute('width', sz); svg.setAttribute('height', mag);
  const elek = D.kapcsolatok.filter(k => k.honnan !== k.hova).map(k => { const [ut, felirat] = gorbe(svg, ob[k.honnan], ob[k.hova], W, H, '', k.nev, 70, D.objektumok); felirat.style.display = 'none'; return { k, ut, felirat }; });
  function mutatObj(id) {
    const o = ob[id], k = $('objektum'); k.textContent = '';
    k.append(h('h3', {}, o.nev), h('div', { class: 'tipus' }, o.tar ? 'közös tárból: ' + o.tar : 'a projekt saját objektuma'));
    const dl = h('dl'); k.append(dl);
    const sor = (t, v) => { if (v) dl.append(h('dt', {}, t), h('dd', {}, v)); };
    sor('Mi ez', o.leiras); sor('Mi azonosítja', o.kulcs); sor('Adatai', (o.adatok || []).join(', ')); sor('Eredete', o.eredet);
    sor('Kapcsolatai', D.kapcsolatok.filter(x => x.honnan === id || x.hova === id).map(x => `${ob[x.honnan].nev} ${x.nev} ${ob[x.hova].nev}`).join('; '));
    sor('Hol szerepel a folyamban', D.csomopontok.filter(c => (c.objektumok || []).includes(id)).map(c => c.nev).join(', '));
    svg.querySelectorAll('g.cs').forEach(e => e.classList.toggle('on', e.dataset.ob === id));
    elek.forEach(e => { const az = e.k.honnan === id || e.k.hova === id; e.ut.classList.toggle('on', az); e.felirat.style.display = az ? '' : 'none'; });
  }
  D.objektumok.forEach(o => {
    const g = s(svg, 'g', { class: 'cs', 'data-ob': o.id });
    s(g, 'title', {}, 'Megmutatja az objektum adatait, kapcsolatait és eredetét');
    s(g, 'rect', { class: 'doboz', x: o.x, y: o.y, width: W, height: H, rx: 7 });
    s(g, 'text', { x: o.x + 12, y: o.y + 21, 'font-weight': 600 }, rov(o.nev, 22));
    s(g, 'text', { class: 'sub', x: o.x + 12, y: o.y + 38 }, rov(o.kulcs || '', 27));
    g.onclick = () => mutatObj(o.id);
  });
})();
</script>
</body>
</html>

# Napi élő előrejelzés: lefuttatja a predict_live.py-t, commitolja a friss
# forecast.json-t és a history snapshotot, majd deployolja a web/ mappát
# GitHub Pages-re. Kézzel is indítható (workflow_dispatch).
name: daily-forecast

on:
  schedule:
    # A GitHub az ütemezett futást terhelés szerint órákkal késleltetheti (2026
    # őszén a 04:30-as futás rendre 11:15 és 11:45 UTC között indult), ezért a
    # jelentés nem készült el reggelre. Három korai időpont: az első, amelyik
    # lefut, elkészíti a napi jelentést, a többi felismeri és kihagyja.
    - cron: "15 23 * * *"
    - cron: "15 1 * * *"
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # külön sor az ütemezett és a kézi futásnak: egy sorban csak egy futás várakozhat,
  # így a következő ütemezett időpont nem törölheti a várakozó kézi indítást
  group: daily-forecast-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
    env:
      # a jelentés dátuma és a "ma" a magyar naptári nap (a 23:15 UTC-s futás már másnap)
      TZ: Europe/Budapest
    # Minden `run:` blokk hibára álljon meg és a pipe-hibák se nyelődjenek el.
    # (A GitHub Actions alapértelmezése is -eo pipefail, de itt explicit rögzítjük,
    #  hogy egy jövőbeli shell-váltás se csendesítse el a hibákat.)
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # ha a mai jelentés már elkészült (egy korábbi időpont lefutott), az ütemezett
      # futás itt megáll; kézi indítás (workflow_dispatch) mindig végigfut
      - name: Elkészült-e már a mai jelentés
        id: guard
        run: |
          # a sorban várakozó futás a létrehozáskori commitot tölti le, ezért a main
          # AKTUÁLIS csúcsán nézzük, elkészült-e már a mai jelentés
          git fetch -q origin main
          if [ "${{ github.event_name }}" = "schedule" ] && git cat-file -e "origin/main:web/data/jelentes/jelentes_$(date +%F).pdf" 2>/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "A mai jelentés már elkészült, kihagyom."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Függőségek
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          # headless Chromium a HTML→PDF rendereléshez (report_html.py)
          python -m playwright install --with-deps chromium

      # Gyors védőháló (~1 mp): a dátum/ablak/kalibráció-magra írt tesztek.
      # Ha ezek buknak, az élő előrejelzés el sem indul — nem publikálunk
      # hibás logikával számolt forecastot.
      - name: Tesztek (megbízhatósági öv)
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          python -m pytest tests/ -q

      - name: Piaci árjegyzések letöltése (EU agrifood API / AKI PÁIR-eredetű)
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # az előrejelzés ELŐTT fut: a forintosítás ezt a friss árat használja.
          # ha az API elérhetetlen, a meglévő (7 napnál frissebb) árak maradnak,
          # elavulás esetén a 4. oldal magától kimarad — a job nem bukik el ezen
          python -m src.fetch_market_prices || echo "::warning::piaci árak frissítése nem sikerült — a meglévő/kimaradó árakkal megy tovább"

      - name: HungaroMet állomási csapadék (mért ellenpróba)
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # hibánál a meglévő fájl marad; 4 napnál régebbit a becslő nem használ
          python -m src.fetch_hungaromet || echo "::warning::HungaroMet letöltése nem sikerült"

      - name: Élő előrejelzés futtatása (mind az öt termény)
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          python -m src.predict_live --crop wheat
          python -m src.predict_live --crop corn
          python -m src.predict_live --crop barley
          # trend-alapú termények (a mérési kapu elutasította az időjárás-modellt);
          # a sokéves trendet közlik, őszintén felcímkézve — csak a weben szerepelnek
          python -m src.predict_live --crop sunflower
          python -m src.predict_live --crop rapeseed

      - name: Napi PDF-jelentés generálása (HTML→PDF)
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          python -m src.report_html

      - name: Friss forecast commit
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data/forecast_*.json web/data/history/ \
                  web/data/market_prices.json web/data/stations.json \
                  web/data/official_estimates.json \
                  web/data/jelentes/ web/data/jelentes_latest.pdf
          if git diff --cached --quiet; then
            echo "Nincs változás, nincs commit."
          else
            git commit -m "napi forecast frissítés ($(date +%F))"
            # Ha közben más commit került a main-re, rebase-elünk push előtt. Ez a
            # commit KIZÁRÓLAG generált fájlokat tartalmaz (lásd a fenti git add
            # listát), ezért ütközésnél mindig a most generált, friss változat a
            # helyes: rebase alatt a "theirs" az éppen alkalmazott (saját) commit.
            if ! git pull --rebase origin main; then
              # A listát ELŐBB fájlba írjuk: ha a `git diff` csővezetéken át,
              # a ciklussal egy időben futna, a két git-folyamat összeakadna az
              # index zárolásán (index.lock) – pontosan ez buktatta el az első próbát.
              git diff --name-only --diff-filter=U > /tmp/conflicts.txt
              while IFS= read -r f; do
                git checkout --theirs -- "$f"
                git add -- "$f"
              done < /tmp/conflicts.txt
              GIT_EDITOR=true git rebase --continue
            fi
            git push
          fi

      # Hibánál látható, összefoglalt üzenet a job-summary lapon (nem nyelődik el).
      # A `if: failure()` miatt csak akkor fut, ha valamelyik előző lépés elhasalt;
      # a záró `exit 1` megtartja a job piros (bukott) státuszát.
      - name: Hiba jelzése (job summary)
        if: failure()
        run: |
          {
            echo "## ❌ Napi előrejelzés HIBA ($(date -u +'%F %T UTC'))"
            echo ""
            echo "A(z) \`daily-forecast\` job egy lépése hibára futott — a forecast"
            echo "NEM frissült. Nézd meg a fenti lépések logját."
            echo ""
            echo "Gyakori okok: adatforrás (KSH/Open-Meteo) kimaradás, fázis-záró"
            echo "ellenőrzés (predict_live sys.exit), push-ütközés."
          } >> "$GITHUB_STEP_SUMMARY"
          # RIASZTÁS-INTEGRÁCIÓ HELYE (külső titok nélkül most nincs bekötve):
          # Slack/e-mail webhookot ide tehetsz, pl.:
          #   curl -fsS -X POST -H 'Content-type: application/json' \
          #     --data '{"text":"daily-forecast bukott: '"$GITHUB_RUN_ID"'"}' \
          #     "$SLACK_WEBHOOK_URL"
          # a $SLACK_WEBHOOK_URL-t repo secretként kell felvenni (Settings > Secrets).
          exit 1

      - name: Pages artifact feltöltése
        if: steps.guard.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: forecast
    # a telepítés közös sorban fut, akárhonnan indult a futás: két egyidejű Pages-
    # telepítés ütközne, vagy a régebbi állapot írhatná felül az újabbat
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    if: needs.forecast.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages-re
        id: deployment
        uses: actions/deploy-pages@v4
